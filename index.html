<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f8ff;
    }
    .calculator {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      width: 330px;
    }
    input {
      width: 100%;
      height: 50px;
      text-align: right;
      font-size: 24px;
      border: 2px solid #ccc;
      border-radius: 5px;
      margin-bottom: 10px;
      padding: 10px;
      background-color: #e6f7ff;
    }
    button {
      width: 60px;
      height: 60px;
      margin: 5px;
      font-size: 18px;
      background-color: #f4f4f4;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #b3e0ff;
    }
    button:active {
      background-color: #80b3ff;
    }
    button.special {
      background-color: #ffcccb;
    }
    button.special:hover {
      background-color: #ff9999;
    }
    button:focus {
      outline: none;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    h1 {
      text-align: center;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h1>Scientific Calculator</h1>
    <input type="text" id="display" disabled />
    <div class="row">
      <button onclick="clearDisplay()" class="special">X</button>
      <button onclick="appendToDisplay('(')">&#40;</button>
      <button onclick="appendToDisplay(')')">&#41;</button>
      <button onclick="appendToDisplay('/')">/</button>
    </div>
    <div class="row">
      <button onclick="appendToDisplay('7')">7</button>
      <button onclick="appendToDisplay('8')">8</button>
      <button onclick="appendToDisplay('9')">9</button>
      <button onclick="appendToDisplay('*')">*</button>
    </div>
    <div class="row">
      <button onclick="appendToDisplay('4')">4</button>
      <button onclick="appendToDisplay('5')">5</button>
      <button onclick="appendToDisplay('6')">6</button>
      <button onclick="appendToDisplay('-')">-</button>
    </div>
    <div class="row">
      <button onclick="appendToDisplay('1')">1</button>
      <button onclick="appendToDisplay('2')">2</button>
      <button onclick="appendToDisplay('3')">3</button>
      <button onclick="appendToDisplay('+')">+</button>
    </div>
    <div class="row">
      <button onclick="appendToDisplay('0')">0</button>
      <button onclick="appendToDisplay('.')">.</button>
      <button onclick="calculateResult()">=</button>
      <button onclick="appendToDisplay('**')">^</button>
    </div>
    <div class="row">
      <button onclick="appendToDisplay('sqrt(')">√</button>
      <button onclick="appendToDisplay('sin(')">sin</button>
      <button onclick="appendToDisplay('cos(')">cos</button>
      <button onclick="appendToDisplay('tan(')">tan</button>
    </div>
  </div>

  <script>
    function clearDisplay() {
      document.getElementById('display').value = '';
    }

    function appendToDisplay(value) {
      document.getElementById('display').value += value;
    }

    function calculateResult() {
      let expression = document.getElementById('display').value;
      try {
        // Replace power (^) with the correct operator for JavaScript
        expression = expression.replace('^', '**');
        
        // Evaluate mathematical expression
        expression = expression.replace('sqrt', 'Math.sqrt');
        expression = expression.replace('sin', 'Math.sin');
        expression = expression.replace('cos', 'Math.cos');
        expression = expression.replace('tan', 'Math.tan');
        
        let result = eval(expression);
        
        if (result === Infinity || isNaN(result)) {
          result = 'Error';
        }
        
        document.getElementById('display').value = result;
      } catch (e) {
        document.getElementById('display').value = 'Error';
      }
    }
  </script>
</body>
</html>
